
name: Extract Electronics Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download website ZIP
        env:
          ZIP_URL: https://github.com/wevibed/Electronics.wevibed/releases/download/v1.0/wevibed-electronics-cloudflare.zip
        run: |
          set -e
          curl -fL "$ZIP_URL" -o /tmp/website.zip
          unzip -t /tmp/website.zip

      - name: Extract website
        run: |
          set -e

          mkdir -p /tmp/electronics-site
          unzip -oq /tmp/website.zip -d /tmp/electronics-site

          # Preserve GitHub Actions workflows.
          # Replace the website files with the extracted project.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          cp -a /tmp/electronics-site/. .

          # Keep the repository's existing workflow files.
          git status --short

      - name: Commit extracted website
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update electronics website"
            git push
          else
            echo "No changes to commit."
          fi
